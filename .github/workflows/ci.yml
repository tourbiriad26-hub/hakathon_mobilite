# Vérification rapide sur les pull requests : le projet dbt compile et les seeds / tests statiques passent.
# (Le build complet avec téléchargement des données tourne sur main : voir build-and-deploy.yml.)
name: CI

on:
  pull_request:

jobs:
  dbt-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m py_compile scripts/ingest.py scripts/export_dashboard.py
      - run: dbt deps --profiles-dir . || true
      - run: dbt seed --profiles-dir . --target dev
      - run: dbt compile --profiles-dir . --target dev
